# The Docker image that will be used to build your app
image: node:lts

stages:
  - build
  - deploy

build_site:
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build   # Compiles your Vite app into the 'dist' folder
  artifacts:
    paths:
      - dist/         # Saves the Vite build output

pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_site
  script:
    - rm -rf public   # Deletes the source public folder from the Git checkout
    - mv dist public  # Renames your build folder to public for GitLab Pages
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'