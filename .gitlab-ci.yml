stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20.11.0" # Use a modern Node version compatible with your project

build_site:
  stage: build
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    # Vite automatically reads variables prefixed with VITE_ from the system environment during build time
    - npm run build
  artifacts:
    paths:
      - dist/ # Default build output folder for Vite

pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_site
  script:
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"' # Deploys automatically when changes hit the main branch